name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    # PHP 8.7 is a nightly build: it runs to show problems early but does not fail the workflow
    continue-on-error: ${{ matrix.php == '8.7' }}
    permissions:
      contents: read
      actions: write

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6', '8.7']
        dependency-version: ['']
        include:
          - php: '8.3'
            dependency-version: '--prefer-lowest'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, soap, openssl
        coverage: ${{ matrix.php == '8.6' && matrix.dependency-version == '' && 'xdebug' || 'none' }}

    - name: Validate composer.json
      run: composer validate --strict

    - name: Cache Composer packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependency-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependency-version }}-

    - name: Install dependencies
      # dev dependencies cap their PHP version, so the nightly ignores the upper bound
      run: composer update ${{ matrix.dependency-version }} ${{ matrix.php == '8.7' && '--ignore-platform-req=php+' || '' }} --prefer-dist --no-progress --no-interaction

    - name: Run tests
      if: matrix.php != '8.6' || matrix.dependency-version != ''
      run: vendor/bin/phpunit --no-coverage

    - name: Run tests with coverage
      if: matrix.php == '8.6' && matrix.dependency-version == ''
      run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-text --coverage-clover build/logs/clover.xml

    - name: Run tests with the OpenSSL legacy provider (DES signatures)
      if: matrix.php == '8.6' && matrix.dependency-version == ''
      # OpenSSL 3 only offers des-ecb through the legacy provider; without it the DES tests are skipped
      run: |
        printf '%s\n' 'openssl_conf = openssl_init' '[openssl_init]' 'providers = provider_sect' \
          '[provider_sect]' 'default = default_sect' 'legacy = legacy_sect' \
          '[default_sect]' 'activate = 1' '[legacy_sect]' 'activate = 1' > "$RUNNER_TEMP/openssl-legacy.cnf"
        export OPENSSL_CONF="$RUNNER_TEMP/openssl-legacy.cnf"
        php -r 'exit(in_array("des-ecb", openssl_get_cipher_methods(), true) ? 0 : 1);' || { echo "des-ecb not available"; exit 1; }
        vendor/bin/phpunit --no-coverage --fail-on-skipped

  code-style:
    name: Code Style (PER-CS + PHP 8.3)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: '8.3'
        extensions: mbstring, soap, openssl
        coverage: none

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Check code style
      run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose

  static-analysis:
    name: Static Analysis (PHPStan level 5)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: '8.3'
        extensions: mbstring, soap, openssl
        coverage: none

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse --memory-limit=1G

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: '8.3'
        extensions: soap
        coverage: none

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run security audit
      run: composer audit
