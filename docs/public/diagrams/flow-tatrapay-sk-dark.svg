<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" role="img" aria-labelledby="t d">
  <title id="t">Priebeh platby TatraPay a CardPay</title>
  <desc id="d">Zákazník zaplatí v e-shope, purchase() ho presmeruje do Tatra banky s podpísanou požiadavkou, banka ho vráti na návratovú URL s podpísaným výsledkom a completePurchase() overí podpis a variabilný symbol skôr, než e-shop označí objednávku ako zaplatenú.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffd200"/>
    </marker>
  </defs>
  <rect x="22" y="12" width="210" height="44" rx="10" fill="#202024" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="127" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f4f4f5" text-anchor="middle">Prehliadač zákazníka</text>
  <path d="M127 56V502" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="275" y="12" width="210" height="44" rx="10" fill="#202024" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="380" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f4f4f5" text-anchor="middle">Váš e-shop</text>
  <path d="M380 56V502" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="528" y="12" width="210" height="44" rx="10" fill="#202024" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="633" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f4f4f5" text-anchor="middle">Tatra banka</text>
  <path d="M633 56V502" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 5"/>
  <path d="M131 134H374" stroke="#ffd200" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">1. Zaplatiť 24,90 €</text>
  <text x="253" y="126" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">objednávka dostane VS 2026001</text>
  <path d="M376 192H133" stroke="#ffd200" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">2. 302 do banky</text>
  <text x="253" y="184" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">purchase(): MID AMT VS … HMAC</text>
  <path d="M131 250H627" stroke="#ffd200" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="380" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">3. GET platobná stránka</text>
  <text x="380" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">podpísané parametre v URL</text>
  <rect x="521" y="268" width="224" height="48" rx="9" fill="#11261a" stroke="#4ade80" stroke-width="1.3"/>
  <text x="633" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">4. zákazník zaplatí</text>
  <text x="633" y="305" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">karta, internet banking</text>
  <path d="M629 366H133" stroke="#ffd200" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="380" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">5. 302 na RURL</text>
  <text x="380" y="358" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">VS RES … TIMESTAMP HMAC</text>
  <path d="M131 424H374" stroke="#ffd200" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">6. GET /payment/return</text>
  <text x="253" y="416" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">podpísaná odpoveď banky</text>
  <rect x="268" y="442" width="224" height="48" rx="9" fill="#11261a" stroke="#4ade80" stroke-width="1.3"/>
  <text x="380" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">7. completePurchase()</text>
  <text x="380" y="479" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">podpis + VS, potom isSuccessful()</text>
</svg>
