<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" width="760" height="454" role="img" aria-labelledby="t d">
  <title id="t">ComfortPay card registration and recurring charges</title>
  <desc id="d">The first payment registers the card (TPAY=Y) and the return carries the card id CID; later charges go to the ComfortPay SOAP web service with the CID, authenticated by the merchant's client certificate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a16207"/>
    </marker>
  </defs>
  <rect x="22" y="12" width="210" height="44" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="127" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Customer's browser</text>
  <path d="M127 56V444" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="275" y="12" width="210" height="44" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="380" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Your shop</text>
  <path d="M380 56V444" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="528" y="12" width="210" height="44" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="633" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Tatra banka</text>
  <path d="M633 56V444" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 5"/>
  <path d="M376 134H133" stroke="#a16207" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#18181b" text-anchor="middle">1. 302 to the bank</text>
  <text x="253" y="126" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#52525b" text-anchor="middle">purchase(): TPAY=Y</text>
  <path d="M629 192H133" stroke="#a16207" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="380" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#18181b" text-anchor="middle">2. 302 to RURL</text>
  <text x="380" y="184" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#52525b" text-anchor="middle">RES=OK CID=111111 … HMAC</text>
  <path d="M131 250H374" stroke="#a16207" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#18181b" text-anchor="middle">3. GET return URL</text>
  <text x="253" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#52525b" text-anchor="middle">the bank's signed answer</text>
  <rect x="268" y="268" width="224" height="48" rx="9" fill="#ecfdf3" stroke="#15803d" stroke-width="1.3"/>
  <text x="380" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#18181b" text-anchor="middle">4. completePurchase()</text>
  <text x="380" y="305" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#52525b" text-anchor="middle">verify, store the CID</text>
  <path d="M384 366H627" stroke="#a16207" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="507" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#18181b" text-anchor="middle">5. charge() over SOAP</text>
  <text x="507" y="358" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#52525b" text-anchor="middle">referedCardId=CID, client certificate</text>
  <path d="M629 424H386" stroke="#a16207" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="507" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#18181b" text-anchor="middle">6. transactionStatus 00</text>
  <text x="507" y="416" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#52525b" text-anchor="middle">approved; a fault with a code otherwise</text>
</svg>
