<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" role="img" aria-labelledby="t d">
  <title id="t">Priebeh platby TatraPay</title>
  <desc id="d">E-shop presmeruje zákazníka do Tatra banky s podpísanou požiadavkou, banka ho vráti s podpísaným výsledkom a completePurchase() overí podpis a variabilný symbol skôr, než sa objednávka označí ako zaplatená.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a16207"/>
    </marker>
  </defs>

  <!-- the shop -->
  <rect x="16" y="20" width="232" height="176" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <path d="M16 34a14 14 0 0 1 14-14h204a14 14 0 0 1 14 14v12H16z" fill="#f4f4f5"/>
  <circle cx="34" cy="34" r="4" fill="#d4d4d8"/><circle cx="48" cy="34" r="4" fill="#d4d4d8"/><circle cx="62" cy="34" r="4" fill="#d4d4d8"/>
  <text x="80" y="38" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#52525b">obchod.example/pokladna</text>
  <text x="36" y="78" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#52525b">Objednávka 2026001</text>
  <text x="36" y="112" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#18181b">24,90 €</text>
  <rect x="36" y="134" width="124" height="40" rx="9" fill="#ffd200"/>
  <text x="98" y="159" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#141414" text-anchor="middle">Zaplatiť</text>

  <!-- signed redirect -->
  <path d="M252 72C350 72 392 78 392 112" fill="none" stroke="#a16207" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="268" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#18181b">purchase()</text>
  <text x="268" y="96" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52525b">podpísaná požiadavka</text>

  <!-- the bank's payment page -->
  <rect x="272" y="120" width="232" height="190" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <path d="M272 134a14 14 0 0 1 14-14h204a14 14 0 0 1 14 14v26H272z" fill="#ffd200"/>
  <text x="290" y="146" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#141414">Tatra banka</text>
  <rect x="290" y="174" width="124" height="78" rx="9" fill="#141414" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="290" y="188" width="124" height="12" fill="#3f3f46"/>
  <rect x="300" y="210" width="20" height="15" rx="3" fill="#ffd200"/>
  <text x="300" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fafafa">•••• 1111</text>
  <text x="426" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#52525b">AMT 24.90</text>
  <text x="426" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#52525b">VS 2026001</text>
  <text x="426" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#52525b">HMAC</text>
  <path d="M461 219l4 4 8-9" fill="none" stroke="#15803d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290" y="264" width="196" height="32" rx="8" fill="#18181b"/>
  <text x="388" y="285" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Potvrdiť platbu</text>

  <!-- signed return -->
  <path d="M392 314C392 364 352 370 272 370" fill="none" stroke="#a16207" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="404" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#18181b">RES=OK</text>
  <text x="404" y="364" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52525b">podpísaný návrat</text>

  <!-- verification -->
  <rect x="16" y="318" width="250" height="104" rx="14" fill="#ecfdf3" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="56" cy="370" r="22" fill="#15803d"/>
  <path d="M46 370l4 4 8-9" fill="none" stroke="#ecfdf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#18181b">completePurchase()</text>
  <text x="92" y="378" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#52525b">podpis a VS overené</text>
  <text x="92" y="402" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#15803d">objednávka zaplatená</text>
</svg>
